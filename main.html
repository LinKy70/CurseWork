<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PinAway</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar__logo">
                <img src="assets/images/Vectorl.png" alt="Логотип компании">
                <h1>PinAway</h1>
            </div>
            <div class="sidebar__buttons">
                <a href="" class="sidebar__button active">Главная страница</a>
                <a href="chooseTour.html" class="sidebar__button">Туры</a>
                <a href="reviews.html" class="sidebar__button">Отзывы клиентов</a>
                <a href="advantages.html" class="sidebar__button">Наши преимущества</a>
            </div>
        </div>
        <div class="container">
            <div class="header">
                <div class="header__search">
                    <label>
                        <input type="text" placeholder="Поиск" class="header__input">
                    </label>
                    <img src="assets/icons/searchIcon.svg" alt="Поиск" class="search__icon">
                </div>
                <div class="header__navigation">
                    <img src="assets/images/Vector-1.png" alt="Корзина" class="header__navigation-links">
                    <img src="assets/icons/Favourite.svg" alt="Избранное" class="header__navigation-links">
                    <img src="assets/images/avagit%201.png" alt="Фото профиля" class="ava">
                </div>
            </div>
            <div class="content">
                <div>
                    <img src="assets/images/worldMap.svg" alt="Карта мира" class="worldMap">
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <a href="" class="footer__link">О нас</a>
        <a href="" class="footer__link">Связаться с нами</a>
    </div>

</body>
</html>
